name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regular pytest tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/unit tests/integration tests/component

      - name: Generate Pact contract
        env:
          PYTHONPATH: .
        run: pytest -q tests/contract/test_open_meteo_contract.py

      - name: Start provider stub
        run: |
          python tests/contract/provider_stub.py &
          sleep 3

      - name: Verify Pact provider
        env:
          PYTHONPATH: .
        run: pytest -q tests/contract/test_provider_verification.py

      - name: Run BDD tests
        env:
          PYTHONPATH: .
        run: behave tests/bdd/features

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build